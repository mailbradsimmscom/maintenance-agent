<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User Task</title>
    <script>
        // Mobile detection and redirect
        (function() {
            if (window.location.pathname.includes('-mobile.html')) return;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isSmallScreen = window.innerWidth <= 768;
            if (isMobile || isSmallScreen) {
                window.location.href = '/edit-user-task-mobile.html';
            }
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Two column layout for date and frequency */
        .date-frequency-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Dynamic frequency fields */
        .frequency-details {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            display: none;
        }
        .frequency-details.active {
            display: block;
        }
        .frequency-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .frequency-input-group input {
            width: 100px;
        }

        /* Quick reschedule buttons */
        .reschedule-shortcuts {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .shortcut-btn {
            padding: 6px 12px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .shortcut-btn:hover {
            background: #667eea;
            color: white;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: space-between;
        }
        .button-group-left {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }

        /* Success/Error messages */
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .message.show {
            display: block;
        }

        .required {
            color: #ef4444;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* Task Selector Section */
        .task-selector {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .task-selector h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .selector-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .selector-group {
            display: flex;
            flex-direction: column;
        }
        .selector-group label {
            margin-bottom: 6px;
            font-size: 13px;
        }
        .selector-group select {
            width: 100%;
        }
        .task-selector.hidden {
            display: none;
        }
        .editing-header {
            background: #e0e7ff;
            border-left: 4px solid #667eea;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .editing-header.show {
            display: block;
        }
        .editing-header p {
            color: #333;
            font-size: 14px;
            margin: 0;
        }
        .editing-header strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/todos.html" class="back-link">← Back to To-Do List</a>

        <div class="card">
            <h1>
                <span>✏️</span>
                Edit User Task
            </h1>
            <p class="subtitle">Update task details or reschedule</p>

            <!-- Task Selector (shows when no ?id= in URL) -->
            <div id="taskSelector" class="task-selector">
                <h3>Select a Task to Edit</h3>
                <div class="selector-row">
                    <div class="selector-group">
                        <label for="systemSelect">1. Select System/Category</label>
                        <select id="systemSelect" onchange="onSystemSelect()">
                            <option value="">-- Select a system --</option>
                        </select>
                    </div>
                    <div class="selector-group">
                        <label for="taskSelect">2. Select Task</label>
                        <select id="taskSelect" onchange="onTaskSelect()" disabled>
                            <option value="">-- Select a system first --</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Editing Header (shows when editing from URL) -->
            <div id="editingHeader" class="editing-header">
                <p>Editing: <strong id="editingTaskName"></strong></p>
            </div>

            <div id="message" class="message"></div>

            <div id="loadingMessage" class="loading">Loading task...</div>

            <form id="editTaskForm" style="display: none;">
                <!-- Description -->
                <div class="form-group">
                    <label for="description">
                        Description <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="description"
                        name="description"
                        required
                    >
                </div>

                <!-- System/Equipment -->
                <div class="form-group">
                    <label for="system">System/Equipment</label>
                    <select id="system" name="system">
                        <option value="0b04ac5e-b490-463f-93a9-dac29b585671">General (Not system-specific)</option>
                        <!-- Systems will be loaded here dynamically -->
                    </select>
                </div>

                <!-- Due Date and Frequency Type in same row -->
                <div class="date-frequency-row">
                    <!-- Due Date -->
                    <div class="form-group">
                        <label for="dueDate">Due Date</label>
                        <input
                            type="date"
                            id="dueDate"
                            name="dueDate"
                        >
                        <!-- Quick reschedule shortcuts -->
                        <div class="reschedule-shortcuts">
                            <button type="button" class="shortcut-btn" onclick="rescheduleBy(1)">+1 day</button>
                            <button type="button" class="shortcut-btn" onclick="rescheduleBy(7)">+1 week</button>
                            <button type="button" class="shortcut-btn" onclick="rescheduleBy(30)">+1 month</button>
                        </div>
                    </div>

                    <!-- Frequency Type -->
                    <div class="form-group">
                        <label for="frequencyType">Frequency Type</label>
                        <select id="frequencyType" name="frequencyType" onchange="toggleFrequencyDetails()">
                            <option value="one-time">One-time</option>
                            <option value="recurring-calendar">Recurring (Calendar)</option>
                            <option value="recurring-usage">Recurring (Usage Hours)</option>
                        </select>
                    </div>
                </div>

                <!-- Dynamic frequency details -->
                <div id="recurringCalendarDetails" class="frequency-details">
                    <div class="frequency-input-group">
                        <label style="margin-bottom: 0;">Repeat every</label>
                        <input
                            type="number"
                            id="calendarInterval"
                            name="calendarInterval"
                            min="1"
                        >
                        <label style="margin-bottom: 0;">days</label>
                    </div>
                </div>

                <div id="recurringUsageDetails" class="frequency-details">
                    <div class="frequency-input-group">
                        <label style="margin-bottom: 0;">Repeat every</label>
                        <input
                            type="number"
                            id="usageInterval"
                            name="usageInterval"
                            min="1"
                        >
                        <label style="margin-bottom: 0;">hours</label>
                    </div>
                </div>

                <!-- Notes -->
                <div class="form-group">
                    <label for="notes">Notes (Optional)</label>
                    <textarea
                        id="notes"
                        name="notes"
                        placeholder="Any additional details or instructions..."
                    ></textarea>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <div class="button-group-left">
                        <button type="submit" class="btn-primary">
                            Save Changes
                        </button>
                        <button type="button" class="btn-success" onclick="markComplete()">
                            ✓ Mark Complete
                        </button>
                    </div>
                    <button type="button" class="btn-danger" onclick="deleteTask()">
                        Delete Task
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentTask = null;
        let taskId = null;
        let allTodos = [];
        let allSystems = [];
        let tasksBySystem = new Map();
        let isUrlMode = false;

        // Parse URL parameters
        function getUrlParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Fetch all todos and group by system
        async function fetchAndGroupTasks() {
            try {
                const response = await fetch('/admin/api/todo');
                const data = await response.json();

                if (data.success) {
                    allTodos = data.data.todos || [];
                    groupTasksBySystem();
                    return true;
                }
                return false;
            } catch (error) {
                console.error('Failed to fetch todos:', error);
                return false;
            }
        }

        // Group tasks by system
        function groupTasksBySystem() {
            tasksBySystem.clear();

            allTodos.forEach(todo => {
                // FILTER: Only show user tasks (this page only edits user tasks)
                if (todo.type !== 'user_task') {
                    return;
                }

                // Determine system key
                let systemKey;
                let systemLabel;
                let storeAssetUid;

                if (!todo.assetUid || todo.assetUid === 'general') {
                    // User Tasks (no system)
                    systemKey = 'user-tasks';
                    systemLabel = 'User Tasks';
                    storeAssetUid = null; // Don't store assetUid for special category
                } else {
                    // Regular system with user task
                    systemKey = todo.assetUid;
                    systemLabel = null; // Will be filled from systems API
                    storeAssetUid = todo.assetUid;
                }

                if (!tasksBySystem.has(systemKey)) {
                    tasksBySystem.set(systemKey, {
                        key: systemKey,
                        label: systemLabel,
                        assetUid: storeAssetUid,
                        tasks: []
                    });
                }

                tasksBySystem.get(systemKey).tasks.push(todo);
            });
        }

        // Populate system dropdown
        function populateSystemDropdown() {
            const systemSelect = document.getElementById('systemSelect');
            systemSelect.innerHTML = '<option value="">-- Select a system --</option>';

            // Sort systems: User Tasks first, then alphabetically
            const systemEntries = Array.from(tasksBySystem.entries());
            systemEntries.sort(([keyA, groupA], [keyB, groupB]) => {
                if (keyA === 'user-tasks') return -1;
                if (keyB === 'user-tasks') return 1;

                const labelA = groupA.label || keyA;
                const labelB = groupB.label || keyB;
                return labelA.localeCompare(labelB);
            });

            systemEntries.forEach(([key, group]) => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = `${group.label || key} (${group.tasks.length})`;
                systemSelect.appendChild(option);
            });
        }

        // Handle system selection
        function onSystemSelect() {
            const systemKey = document.getElementById('systemSelect').value;
            const taskSelect = document.getElementById('taskSelect');

            if (!systemKey) {
                taskSelect.disabled = true;
                taskSelect.innerHTML = '<option value="">-- Select a system first --</option>';
                return;
            }

            const group = tasksBySystem.get(systemKey);
            if (!group) return;

            // Enable and populate task dropdown
            taskSelect.disabled = false;
            taskSelect.innerHTML = '<option value="">-- Select a task --</option>';

            group.tasks.forEach(todo => {
                const option = document.createElement('option');
                // Extract actual task ID from the todo id (e.g., "user-task-123" -> "123")
                const actualTaskId = extractTaskId(todo);
                option.value = actualTaskId;

                // Format: "Task Title - Due: Nov 15"
                let displayText = todo.title;
                if (todo.dueDate) {
                    const dueDate = new Date(todo.dueDate).toLocaleDateString();
                    displayText += ` - Due: ${dueDate}`;
                }
                option.textContent = displayText;

                taskSelect.appendChild(option);
            });
        }

        // Extract actual task ID from todo object
        function extractTaskId(todo) {
            // todo.id format: "user-task-123", "maintenance-456", etc.
            // We need to extract the UUID part
            if (todo.metadata && todo.metadata.taskId) {
                return todo.metadata.taskId;
            }
            // Fallback: parse from id string
            const parts = todo.id.split('-');
            return parts[parts.length - 1];
        }

        // Handle task selection
        function onTaskSelect() {
            const selectedTaskId = document.getElementById('taskSelect').value;
            if (!selectedTaskId) return;

            // Load the selected task
            taskId = selectedTaskId;
            loadTask();
        }

        // Load task data
        async function loadTask() {
            // taskId should already be set (either from URL or selector)
            if (!taskId) {
                showMessage('No task ID provided', 'error');
                document.getElementById('loadingMessage').style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`/admin/api/user-tasks/${taskId}`);
                const data = await response.json();

                if (data.success) {
                    currentTask = data.data;
                    populateForm(currentTask);
                    document.getElementById('loadingMessage').style.display = 'none';
                    document.getElementById('editTaskForm').style.display = 'block';

                    // If in URL mode, show editing header
                    if (isUrlMode) {
                        document.getElementById('editingTaskName').textContent = currentTask.description;
                        document.getElementById('editingHeader').classList.add('show');
                    }
                } else {
                    showMessage('Task not found', 'error');
                    document.getElementById('loadingMessage').textContent = 'Task not found';
                }
            } catch (error) {
                showMessage(`Error loading task: ${error.message}`, 'error');
                console.error('Failed to load task:', error);
            }
        }

        // Populate form with task data
        function populateForm(task) {
            document.getElementById('description').value = task.description;

            // Set system
            if (task.asset_uid) {
                document.getElementById('system').value = task.asset_uid;
            } else {
                document.getElementById('system').value = 'general';
            }

            // Set due date
            const dueDate = new Date(task.due_date).toISOString().split('T')[0];
            document.getElementById('dueDate').value = dueDate;

            // Set frequency
            if (task.is_recurring) {
                if (task.frequency_basis === 'calendar') {
                    document.getElementById('frequencyType').value = 'recurring-calendar';
                    document.getElementById('calendarInterval').value = task.frequency_value;
                } else if (task.frequency_basis === 'usage') {
                    document.getElementById('frequencyType').value = 'recurring-usage';
                    document.getElementById('usageInterval').value = task.frequency_value;
                }
            } else {
                document.getElementById('frequencyType').value = 'one-time';
            }

            // Set notes
            if (task.notes) {
                document.getElementById('notes').value = task.notes;
            }

            // Show correct frequency details
            toggleFrequencyDetails();
        }

        // Load systems from API
        async function loadSystems() {
            try {
                const response = await fetch('/admin/api/system-maintenance');
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    allSystems = data.data;

                    // Enrich tasksBySystem with display names (skip special categories)
                    tasksBySystem.forEach((group, key) => {
                        // Skip enrichment for special categories
                        if (key === 'user-tasks') {
                            return;
                        }

                        if (group.assetUid && group.assetUid !== 'general') {
                            const system = allSystems.find(s => s.asset_uid === group.assetUid);
                            if (system) {
                                group.label = system.display_name || system.subsystem_norm || system.description ||
                                             `System ${system.asset_uid.substring(0, 8)}`;
                            }
                        }
                    });

                    // Update the form's system dropdown
                    const select = document.getElementById('system');
                    const generalOption = select.options[0];
                    const currentValue = select.value;

                    select.innerHTML = '';
                    select.appendChild(generalOption);

                    // Add systems using display_name (Manufacturer Model)
                    allSystems.forEach(sys => {
                        const displayName = sys.display_name || sys.subsystem_norm || sys.description ||
                                          `System ${sys.asset_uid.substring(0, 8)}`;
                        const option = document.createElement('option');
                        option.value = sys.asset_uid;
                        option.textContent = displayName;
                        select.appendChild(option);
                    });

                    // Restore selection
                    if (currentValue) {
                        select.value = currentValue;
                    }

                    // Populate system selector dropdown
                    populateSystemDropdown();
                }
            } catch (error) {
                console.error('Failed to load systems:', error);
            }
        }

        // Toggle frequency details based on type
        function toggleFrequencyDetails() {
            const frequencyType = document.getElementById('frequencyType').value;
            const calendarDetails = document.getElementById('recurringCalendarDetails');
            const usageDetails = document.getElementById('recurringUsageDetails');

            // Hide all first
            calendarDetails.classList.remove('active');
            usageDetails.classList.remove('active');

            // Show relevant one
            if (frequencyType === 'recurring-calendar') {
                calendarDetails.classList.add('active');
            } else if (frequencyType === 'recurring-usage') {
                usageDetails.classList.add('active');
            }
        }

        // Quick reschedule function
        function rescheduleBy(days) {
            const dueDateInput = document.getElementById('dueDate');
            const currentDate = new Date(dueDateInput.value);
            currentDate.setDate(currentDate.getDate() + days);
            dueDateInput.value = currentDate.toISOString().split('T')[0];
        }

        // Handle form submission (save changes)
        document.getElementById('editTaskForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(e.target);
            const frequencyType = formData.get('frequencyType');

            // Build update object
            const updates = {
                description: formData.get('description'),
                asset_uid: formData.get('system'),
                due_date: formData.get('dueDate') + 'T09:00:00Z',
                notes: formData.get('notes') || null
            };

            // Set frequency based on type
            if (frequencyType === 'one-time') {
                updates.is_recurring = false;
                updates.frequency_basis = null;
                updates.frequency_value = null;
                updates.frequency_unit = null;
            } else if (frequencyType === 'recurring-calendar') {
                updates.is_recurring = true;
                updates.frequency_basis = 'calendar';
                updates.frequency_value = parseInt(formData.get('calendarInterval'));
                updates.frequency_unit = 'days';
            } else if (frequencyType === 'recurring-usage') {
                updates.is_recurring = true;
                updates.frequency_basis = 'usage';
                updates.frequency_value = parseInt(formData.get('usageInterval'));
                updates.frequency_unit = 'hours';
            }

            try {
                const response = await fetch(`/admin/api/user-tasks/${taskId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updates)
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('✅ Task updated successfully!', 'success');

                    // Optionally redirect back to todos after short delay
                    setTimeout(() => {
                        window.location.href = '/todos.html';
                    }, 1500);
                } else {
                    showMessage(`❌ Failed to update task: ${result.error?.message || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
                console.error('Failed to update task:', error);
            }
        });

        // Mark task as complete
        async function markComplete() {
            if (!confirm('Mark this task as complete?')) return;

            try {
                const response = await fetch(`/admin/api/user-tasks/${taskId}/complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.success) {
                    if (result.data.is_recurring) {
                        showMessage(`✅ Task completed! Next due: ${new Date(result.data.due_date).toLocaleDateString()}`, 'success');
                        // Reload task to show new due date
                        setTimeout(() => loadTask(), 2000);
                    } else {
                        showMessage('✅ Task completed!', 'success');
                        setTimeout(() => {
                            window.location.href = '/todos.html';
                        }, 1500);
                    }
                } else {
                    showMessage(`❌ Failed to complete task: ${result.error?.message || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
                console.error('Failed to complete task:', error);
            }
        }

        // Delete task
        async function deleteTask() {
            if (!confirm('Are you sure you want to delete this task? This cannot be undone.')) return;

            try {
                const response = await fetch(`/admin/api/user-tasks/${taskId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('✅ Task deleted!', 'success');
                    setTimeout(() => {
                        window.location.href = '/todos.html';
                    }, 1500);
                } else {
                    showMessage(`❌ Failed to delete task: ${result.error?.message || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
                console.error('Failed to delete task:', error);
            }
        }

        // Show message
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type} show`;

            // Auto-hide after 5 seconds
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 5000);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async function() {
            // Check if we have a task ID in URL (URL mode)
            const urlTaskId = getUrlParam('id');
            isUrlMode = !!urlTaskId;

            if (isUrlMode) {
                // URL Mode: Hide selector, show editing header, load task directly
                taskId = urlTaskId;
                document.getElementById('taskSelector').classList.add('hidden');
                document.getElementById('loadingMessage').style.display = 'block';

                await loadSystems();
                await loadTask();
            } else {
                // Selector Mode: Show selector, fetch tasks, wait for user selection
                document.getElementById('loadingMessage').textContent = 'Loading tasks...';
                document.getElementById('loadingMessage').style.display = 'block';

                const success = await fetchAndGroupTasks();
                if (success) {
                    await loadSystems();
                    document.getElementById('loadingMessage').style.display = 'none';
                } else {
                    document.getElementById('loadingMessage').textContent = 'Failed to load tasks';
                }
            }
        });
    </script>
</body>
</html>
